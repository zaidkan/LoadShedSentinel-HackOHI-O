name: AEP source-impact integration

on:
  push:
    branches: [fix/aep-source-connected-demo]
  pull_request:
    paths:
      - "engine/aep_impact.py"
      - "engine/scenarios.py"
      - "api/**"
      - "data/processed/network_bundle.json"
      - "tests/test_aep_impact.py"
      - "tests/test_api.py"
      - "tests/test_scenarios.py"
      - "web/**"
      - "contracts/**"
      - ".github/workflows/aep-impact.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip fastapi pydantic httpx pytest
      - name: Compile Python
        run: python -m compileall -q api engine
      - name: Test source-derived incidents and API
        run: python -m pytest -q tests/test_aep_impact.py tests/test_scenarios.py tests/test_api.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
